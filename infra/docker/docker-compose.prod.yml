name: renlo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renlo}
      POSTGRES_USER: ${POSTGRES_USER:-renlo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renlo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-renlo} -d ${POSTGRES_DB:-renlo}']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ../kafka/topics.json:/etc/kafka/topics.json:ro
      - ./kafka-init.sh:/kafka-init.sh:ro
    entrypoint: ['/bin/bash', '/kafka-init.sh']
    restart: 'no'

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    env_file:
      - ../../.env
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-renlo}:${POSTGRES_PASSWORD:-renlo}@postgres:5432/${POSTGRES_DB:-renlo}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=1
      KAFKA_MESSENGER_DSN: kafka://kafka:9092
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      TRUSTED_PROXIES: REMOTE_ADDR
      DEFAULT_URI: ${DEFAULT_URI:-https://89.108.72.136}
      SITE_URL: ${SITE_URL:-https://89.108.72.136}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      YANDEX_GEOSEARCH_API_KEY: ${YANDEX_GEOSEARCH_API_KEY:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      FX_USD_BYN: ${FX_USD_BYN:-3.27}
      FX_USD_RUB: ${FX_USD_RUB:-93}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-renlo_bot}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/var/www/backend/public/uploads
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./apache/backend.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./backend-entrypoint.sh:/usr/local/bin/backend-entrypoint.sh:ro
    expose:
      - '80'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1/api/health | grep -q ok || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://89.108.72.136}
        VITE_USD_TO_BYN_RATE: ${VITE_USD_TO_BYN_RATE:-3.27}
        VITE_USD_TO_RUB_RATE: ${VITE_USD_TO_RUB_RATE:-93}
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    expose:
      - '80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/proxy.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://backend:80/api/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  grafana_data:
  backend_uploads:
