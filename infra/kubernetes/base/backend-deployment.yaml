apiVersion: apps/v1
kind: Deployment
metadata:
  name: renlo-backend
  namespace: renlo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: renlo-backend
  template:
    metadata:
      labels:
        app: renlo-backend
    spec:
      containers:
        - name: php-fpm
          image: renlo/backend:latest
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: renlo-config
            - secretRef:
                name: renlo-secrets
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-config
          configMap:
            name: renlo-backend-nginx
