apiVersion: v1
kind: Secret
metadata:
  name: renlo-secrets
  namespace: renlo
type: Opaque
stringData:
  APP_SECRET: change-me-in-production
  POSTGRES_PASSWORD: renlo
  DATABASE_URL: postgresql://renlo:renlo@renlo-postgres:5432/renlo?serverVersion=16&charset=utf8
  GRAFANA_ADMIN_PASSWORD: admin
  TELEGRAM_WEBHOOK_SECRET: change-me-telegram-webhook-secret
