apiVersion: apps/v1
kind: Deployment
metadata:
  name: renlo-frontend
  namespace: renlo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: renlo-frontend
  template:
    metadata:
      labels:
        app: renlo-frontend
    spec:
      containers:
        - name: frontend
          image: renlo/frontend:latest
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: renlo-config
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
