apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: renlo-backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: renlo-frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: ConfigMap
      name: renlo-config
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: prod
      - op: replace
        path: /data/CORS_ALLOW_ORIGIN
        value: '^https?://(.*\.)?renlo\.by$'
      - op: replace
        path: /data/DEFAULT_URI
        value: https://renlo.by
  - target:
      kind: Ingress
      name: renlo-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: renlo.by

images:
  - name: renlo/backend
    newTag: prod
  - name: renlo/frontend
    newTag: prod
